<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comparar direcciones · Ronda 2</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f4f5;
        --panel: #ffffff;
        --text: #111;
        --muted: #666;
        --line: #e4e4e7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0c;
          --panel: #151517;
          --text: #eee;
          --muted: #9a9a9a;
          --line: #27272a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 system-ui, sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
        padding: 12px 20px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      h1 {
        font-size: 15px;
        margin: 0 auto 0 0;
      }
      .seg {
        display: flex;
        gap: 2px;
        padding: 2px;
        border-radius: 8px;
        background: var(--bg);
      }
      .seg button {
        border: 0;
        background: none;
        color: var(--muted);
        font: inherit;
        padding: 5px 10px;
        border-radius: 6px;
        cursor: pointer;
      }
      .seg [aria-pressed='true'] {
        background: var(--panel);
        color: var(--text);
        box-shadow: 0 0 0 1px var(--line);
      }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr));
        gap: 20px;
        padding: 20px;
      }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px 12px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }
      .head h2 {
        margin: 0;
        font-size: 16px;
      }
      .head p {
        margin: 0;
        color: var(--muted);
        flex-basis: 100%;
      }
      .head a {
        color: inherit;
        font-size: 13px;
      }
      .frame {
        position: relative;
        overflow: hidden;
        background: var(--bg);
      }
      iframe {
        border: 0;
        transform-origin: 0 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Rediseño v2 · Ronda 2</h1>
      <div class="seg" role="group" aria-label="Tema">
        <button type="button" data-theme="" aria-pressed="true">Por defecto</button>
        <button type="button" data-theme="light" aria-pressed="false">Claro</button>
        <button type="button" data-theme="dark" aria-pressed="false">Oscuro</button>
      </div>
      <div class="seg" role="group" aria-label="Ancho">
        <button type="button" data-w="1440" aria-pressed="true">1440</button>
        <button type="button" data-w="375" aria-pressed="false">375</button>
      </div>
    </header>
    <main id="grid"></main>
    <script>
      // Direcciones construidas en la ronda 2 (se añaden aquí según se construyen).
      const DIRS = [
        { id: 'linea', nombre: 'Línea', nivel: 'Profesional, estilo Linear', frase: 'Precisión tranquila: todo a mano desde el teclado y nada que sobre.' },
        { id: 'plano', nombre: 'Plano', nivel: 'Profesional, estilo Vercel', frase: 'Blanco, negro y una rejilla: lo importante se ve porque no hay nada más.' },
      ]
      let theme = ''
      let w = 1440
      const grid = document.getElementById('grid')
      function render() {
        grid.innerHTML = DIRS.map(
          (d) => `<section><div class="head"><h2>${d.nombre}</h2><span>${d.nivel}</span>
            <a href="direcciones/${d.id}/${theme ? `?theme=${theme}` : ''}" target="_blank">Abrir a pantalla completa</a>
            <a href="capturas/${d.id}-demo.mp4" target="_blank">Vídeo de la demo</a><a href="capturas/${d.id}-demo.gif" target="_blank">GIF</a>
            <p>${d.frase}</p></div>
            <div class="frame"><iframe title="${d.nombre}" src="direcciones/${d.id}/?bare=1${theme ? `&theme=${theme}` : ''}"></iframe></div></section>`,
        ).join('')
        fit()
      }
      function fit() {
        document.querySelectorAll('.frame').forEach((f) => {
          const iframe = f.querySelector('iframe')
          const h = w === 375 ? 812 : 900
          const scale = Math.min(1, f.clientWidth / w)
          iframe.style.width = `${w}px`
          iframe.style.height = `${h}px`
          iframe.style.transform = `scale(${scale})`
          f.style.height = `${h * scale}px`
          f.style.width = w === 375 ? `${Math.min(f.parentElement.clientWidth, 375 * scale)}px` : ''
          f.style.margin = w === 375 ? '0 auto' : ''
        })
      }
      document.querySelector('header').addEventListener('click', (e) => {
        const b = e.target.closest('button')
        if (!b) return
        b.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b))
        if ('theme' in b.dataset) theme = b.dataset.theme
        if (b.dataset.w) w = +b.dataset.w
        render()
      })
      addEventListener('resize', fit)
      render()
    </script>
  </body>
</html>
