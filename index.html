    <title>Nextuss — Centro de mando</title>
    <script>
      (function () {
        try {
          var cached = localStorage.getItem('nx-theme')
          var theme = cached || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          /* no-op: falls back to the light default already in index.css */
        }
      })()
    </script>
